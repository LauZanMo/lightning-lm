x-host-runtime: &host-runtime
    network_mode: host
    ipc: host
    pid: host

x-ros2-env: &ros2-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: /root/cyclonedds.xml

x-cyclonedds-default-mount: &cyclonedds-default-mount ${CYCLONEDDS_DEFAULT_CONFIG}:/root/cyclonedds.xml:ro
x-cyclonedds-zenoh-mount: &cyclonedds-zenoh-mount ${CYCLONEDDS_ZENOH_CONFIG}:/root/cyclonedds.xml:ro
x-iox-roudi-mount: &iox-roudi-mount ${IOX_ROUDI_CONFIG}:/root/roudi_config.toml:ro

services:
  lightning:
    image: lightning-lm:dev
    <<: *host-runtime
    working_dir: /root/slam_ws/src/lightning-lm
    environment:
      <<: *ros2-env
      DISPLAY: ":0"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - "../../..:/root/slam_ws"
      - *cyclonedds-default-mount
      - "/tmp/.X11-unix:/tmp/.X11-unix:ro"
    command:
      - bash
      - -c
      - |
        source /root/slam_ws/install/setup.bash
        exec ros2 run lightning run_loc_online --config ./config/f400.yaml

  foxglove-bridge:
    image: lightning-lm:dev
    <<: *host-runtime
    environment:
      <<: *ros2-env
    volumes:
      - *cyclonedds-default-mount
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash
        ros2 launch foxglove_bridge foxglove_bridge_launch.xml address:=0.0.0.0 port:=8765
